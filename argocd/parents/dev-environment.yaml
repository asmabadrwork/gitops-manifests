apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-environment-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/asmabadrwork/gitops-manifests.git'
    targetRevision: HEAD
    path: argocd/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
