apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-project
  namespace: argocd
spec:
  description: Dev Environment Security Boundary
  # ALLOW Argo CD to create Namespaces automatically!
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
      
  sourceRepos:
    - 'https://github.com/asmabadrwork/gitops-manifests.git'
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
